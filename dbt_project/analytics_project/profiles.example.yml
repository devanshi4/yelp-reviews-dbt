# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR). Values come from .env.
analytics_project:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME', 'dbt_analytics') }}"
      schema: public
      threads: 4
