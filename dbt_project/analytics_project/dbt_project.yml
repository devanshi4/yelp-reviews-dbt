name: 'analytics_project'
version: '1.0.0'
profile: 'analytics_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Staging stays a view (always current, nothing stored). Intermediate logic is
# ephemeral (inlined into the marts). Marts are tables for fast reads.
models:
  analytics_project:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
